name: Temporary provider benchmark formatter

on:
  push:
    branches:
      - bench/first-render-interactions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: bench/first-render-interactions
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format benchmark harness
        run: bunx prettier --write benchmarks/providers/browser.mjs benchmarks/providers/contract.mjs benchmarks/providers/contract.test.mjs benchmarks/providers/run.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/providers/browser.mjs benchmarks/providers/contract.mjs benchmarks/providers/contract.test.mjs benchmarks/providers/run.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format provider benchmark harness [skip ci]"
          git push origin HEAD:bench/first-render-interactions
