name: Remove viz-engine residue

on:
  push:
    branches:
      - chore/remove-viz-engine-residue

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: chore/remove-viz-engine-residue

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Remove unused dependency
        run: bun remove @moritzbrantner/viz-engine

      - name: Commit regenerated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "Remove viz-engine install residue"
            git push origin HEAD:chore/remove-viz-engine-residue
          fi
