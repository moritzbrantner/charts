name: Regenerate API report once

on:
  push:
    branches:
      - fix/ci-baseline

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6.0.2
        with:
          ref: fix/ci-baseline

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build WASM
        run: |
          cargo install wasm-pack --version 0.14.0 --locked
          bun run build:wasm

      - name: Regenerate API report
        run: |
          bun run build
          node ./scripts/check-api-report.mjs || true
          test -f temp/charts.api.md
          cp temp/charts.api.md etc/charts.api.md
          node ./scripts/check-api-report.mjs

      - name: Commit generated contract
        run: |
          rm .github/workflows/regenerate-api-report-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etc/charts.api.md .github/workflows/regenerate-api-report-once.yml
          git commit -m "Update complete charts API report"
          git push origin HEAD:fix/ci-baseline
