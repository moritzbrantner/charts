name: Fix decoupling lint once

on:
  push:
    branches:
      - decouple-ui-runtime

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: decouple-ui-runtime
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Make heading content explicit
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/internal/ui-primitives.tsx")
          text = path.read_text()
          old = '''export function CardTitle({ className, ...props }: HTMLAttributes<HTMLHeadingElement>) {
            return <h3 className={cn("font-semibold leading-none tracking-tight", className)} {...props} />;
          }'''
          new = '''export function CardTitle({ children, className, ...props }: HTMLAttributes<HTMLHeadingElement>) {
            return (
              <h3 className={cn("font-semibold leading-none tracking-tight", className)} {...props}>
                {children}
              </h3>
            );
          }'''
          if old not in text:
              raise SystemExit("CardTitle shape changed")
          path.write_text(text.replace(old, new))
          PY
      - name: Fix migration lint
        run: |
          bunx eslint --fix \
            src/components/axis.tsx \
            src/components/chrome.tsx \
            src/components/interactive.tsx \
            src/components/selectors.tsx \
            src/components/svg-hierarchy.tsx \
            src/components/value-preview.tsx \
            src/internal/ui-primitives.tsx
      - name: Verify touched files
        run: |
          bunx eslint \
            src/components/axis.tsx \
            src/components/chrome.tsx \
            src/components/interactive.tsx \
            src/components/selectors.tsx \
            src/components/svg-hierarchy.tsx \
            src/components/value-preview.tsx \
            src/internal/ui-primitives.tsx
          bun run check-types
      - name: Commit fix
        run: |
          rm .github/workflows/fix-decouple-lint-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix charts decoupling lint"
          git push origin HEAD:decouple-ui-runtime
