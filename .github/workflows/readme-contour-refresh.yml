name: Refresh Contour Docs Once

on:
  push:
    branches:
      - feat/contour-bin-transforms
    paths:
      - .github/workflows/readme-contour-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Update README
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("README.md"); s=p.read_text(); a="- `createProgressiveChartDensityIndex(points, options)`\n"; assert a in s; s=s.replace(a,a+"- `createChartBinTransform(data, options)` / `createChartContours(grid, options)`\n",1); old="- future contour and bin transforms\n"; assert old in s; p.write_text(s.replace(old,"- contour and generic bin transforms\n",1))'

      - name: Commit docs and remove helper
        shell: bash
        run: |
          git rm .github/workflows/readme-contour-refresh.yml
          git add README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: document bin and contour transforms"
          git push origin HEAD:${GITHUB_REF_NAME}
