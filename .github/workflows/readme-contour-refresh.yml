name: Refresh Contour Docs Once

on:
  push:
    branches:
      - feat/contour-bin-transforms
    paths:
      - .github/workflows/readme-contour-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Update README
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()

          api_anchor = '- `createProgressiveChartDensityIndex(points, options)`\n'
          api_insert = api_anchor + '- `createChartBinTransform(data, options)` / `createChartContours(grid, options)`\n'
          if api_anchor not in text:
              raise SystemExit('API anchor missing')
          text = text.replace(api_anchor, api_insert, 1)

          section_anchor = '## Gap behavior\n'
          section = '''## Generic bin and contour transforms

Use `createChartBinTransform` when arbitrary finite values need deterministic,
renderer-neutral bin geometry without constructing a density index. Domain
endpoints are inclusive and the maximum value is assigned to the final bin.

```ts
const bins = createChartBinTransform(rows, {
  binCount: 24,
  value: (row) => row.duration,
});
```

Use `createChartContours` to extract deterministic contour polylines from a
regular scalar grid. The transform returns data-space points only; SVG, canvas,
WebGL, or server-side renderers remain responsible for drawing or filling them.

```ts
const contours = createChartContours(
  {
    values,
    xCount: 64,
    yCount: 32,
    xDomain: [0, 1_000],
    yDomain: [0, 500],
  },
  { thresholds: [0.25, 0.5, 0.75] },
);
```

'''
          if section_anchor not in text:
              raise SystemExit('section anchor missing')
          text = text.replace(section_anchor, section + section_anchor, 1)

          roadmap_old = '- future contour and bin transforms\n'
          roadmap_new = '- contour and generic bin transforms\n'
          if roadmap_old not in text:
              raise SystemExit('roadmap anchor missing')
          text = text.replace(roadmap_old, roadmap_new, 1)

          path.write_text(text)
          PY

      - name: Commit docs and remove helper workflow
        run: |
          git rm .github/workflows/readme-contour-refresh.yml
          git add README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: document bin and contour transforms"
          git push origin HEAD:${GITHUB_REF_NAME}
