name: Deterministic quality repair v2

on:
  push:
    branches:
      - fix/coverage-generated-wasm
    paths:
      - .github/workflows/deterministic-quality-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/coverage-generated-wasm
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build WASM
        run: bun run build:wasm
      - name: Repair deterministic test contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          wasm_index = Path("src/wasm-index.ts")
          text = wasm_index.read_text()
          start_marker = "    getBackendCapabilities() {\n"
          end_marker = "\n\n    getBinnedSeries"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("WASM capability method boundaries not found")
          desired = """    getBackendCapabilities() {
            return WASM_CAPABILITIES;
          },"""
          text = text[:start] + desired + text[end:]
          wasm_index.write_text(text)

          table_test = Path("src/components/density-table.test.tsx")
          text = table_test.read_text()
          old = '    expect(screen.getByRole("cell", { name: "2" })).toBeTruthy();'
          new = '    expect(screen.getAllByRole("cell", { name: "2" })).toHaveLength(2);'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("density table assertion not found")
          table_test.write_text(text)
          PY
          bunx prettier@3.8.3 --write src/wasm-index.ts src/components/density-table.test.tsx
      - name: Generate exact public API report
        run: |
          bun run build
          node ./scripts/check-api-report.mjs || true
          test -f temp/charts.api.md
          cp temp/charts.api.md etc/charts.api.md
      - name: Validate deterministic quality lane
        run: |
          bun run check-types
          bun run lint
          bun run format:check
          bun run docs:check
          bun run test:coverage
          bun run api:check
          git diff --check
      - name: Commit validated repair
        run: |
          git rm .github/workflows/deterministic-quality-repair-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wasm-index.ts src/components/density-table.test.tsx etc/charts.api.md
          git diff --cached --quiet && { echo "No repair changes produced"; exit 1; }
          git commit -m "fix: align WASM checks and generated API report"
          git push origin HEAD:fix/coverage-generated-wasm
