name: Audit Debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  production-closure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Show production licenses JSON
        run: bun pm licenses --production --json

      - name: Show audit JSON
        run: bun audit --json || true
