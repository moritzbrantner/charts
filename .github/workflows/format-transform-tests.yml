name: Format Transform Tests Once

on:
  push:
    branches:
      - feat/contour-bin-transforms
    paths:
      - .github/workflows/format-transform-tests.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format test
        run: bunx prettier --write src/density/transforms.test.ts

      - name: Commit formatting and remove helper
        run: |
          git rm .github/workflows/format-transform-tests.yml
          git add src/density/transforms.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format transform regressions"
          git push origin HEAD:${GITHUB_REF_NAME}
