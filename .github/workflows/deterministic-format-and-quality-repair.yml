name: Deterministic format and quality repair

on:
  push:
    branches:
      - fix/coverage-generated-wasm
    paths:
      - .github/workflows/deterministic-format-and-quality-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/coverage-generated-wasm
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build WASM
        run: bun run build:wasm
      - name: Apply exact repository formatter
        run: bunx prettier@3.8.3 --write src/wasm-kernel.ts
      - name: Validate deterministic quality lane
        run: |
          bun run check-types
          bun run lint
          bun run format:check
          bun run docs:check
          bun run test:coverage
          bun run api:check
          git diff --check
      - name: Commit source-only repair
        run: |
          git rm .github/workflows/deterministic-format-and-quality-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wasm-kernel.ts
          git commit -m "style: format WASM loader"
          git push origin HEAD:fix/coverage-generated-wasm
