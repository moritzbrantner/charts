name: Format diagnostic

on:
  push:
    branches:
      - fix/coverage-generated-wasm

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Show exact formatter rewrite
        run: |
          bun run format
          git diff --exit-code -- src/wasm-kernel.ts
