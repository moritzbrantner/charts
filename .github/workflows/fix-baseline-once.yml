name: Fix chart baseline once

on:
  push:
    branches:
      - decouple-ui-runtime

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: decouple-ui-runtime
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply baseline repairs
        run: |
          python3 <<'PY'
          from pathlib import Path

          test_path = Path("src/index.test.ts")
          text = test_path.read_text()

          import_anchor = '''  getChartGapAnnotations,\n  getChartValueModeDefinition,'''
          import_replacement = '''  getChartGapAnnotations,\n  loadChartWasmKernel,\n  getChartValueModeDefinition,'''
          if import_anchor not in text:
              raise SystemExit("index test import anchor changed")
          text = text.replace(import_anchor, import_replacement, 1)

          old_owned = '''  test("serves WASM series through the external viz-engine backend", () => {'''
          new_owned = '''  test("serves WASM series through the repository-owned WASM backend", async () => {\n    await loadChartWasmKernel();'''
          if old_owned not in text:
              raise SystemExit("owned WASM test anchor changed")
          text = text.replace(old_owned, new_owned, 1)

          caps_anchor = '''  test("reports backend capabilities", async () => {\n    const hybrid ='''
          caps_replacement = '''  test("reports backend capabilities", async () => {\n    await loadChartWasmKernel();\n\n    const hybrid ='''
          if caps_anchor not in text:
              raise SystemExit("capabilities test anchor changed")
          text = text.replace(caps_anchor, caps_replacement, 1)

          fake_worker_anchor = '''    setTimeout(() => {\n      try {\n        if (message.type === "build") {\n          this.#index = createChartDensityIndex(message.points ?? [], {'''
          fake_worker_replacement = '''    setTimeout(async () => {\n      try {\n        if (message.type === "build") {\n          await loadChartWasmKernel();\n          this.#index = createChartDensityIndex(message.points ?? [], {'''
          if fake_worker_anchor not in text:
              raise SystemExit("fake worker anchor changed")
          text = text.replace(fake_worker_anchor, fake_worker_replacement, 1)
          test_path.write_text(text)

          ci_path = Path(".github/workflows/ci.yml")
          ci = ci_path.read_text()
          old_dependency = '''  dependency-review:\n    runs-on: ubuntu-latest\n    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'\n    permissions:\n      contents: read\n      pull-requests: read\n\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v6.0.2\n\n      - name: Dependency review\n        uses: actions/dependency-review-action@v5.0.0\n'''
          new_dependency = '''  dependency-review:\n    runs-on: ubuntu-latest\n    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'\n    permissions:\n      contents: read\n      pull-requests: read\n\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v6.0.2\n\n      - name: Check Dependency Graph availability\n        id: dependency-graph\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          if gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" >/dev/null 2>&1; then\n            echo "available=true" >> "$GITHUB_OUTPUT"\n          else\n            echo "available=false" >> "$GITHUB_OUTPUT"\n            echo "::notice::Dependency Graph is unavailable; falling back to Bun production audit."\n          fi\n\n      - name: Dependency review\n        if: steps.dependency-graph.outputs.available == 'true'\n        uses: actions/dependency-review-action@v5.0.0\n\n      - name: Setup Bun fallback\n        if: steps.dependency-graph.outputs.available != 'true'\n        uses: oven-sh/setup-bun@v2.2.0\n        with:\n          bun-version: ${{ env.BUN_VERSION }}\n\n      - name: Install dependencies for fallback audit\n        if: steps.dependency-graph.outputs.available != 'true'\n        run: bun install --frozen-lockfile\n\n      - name: Production dependency audit fallback\n        if: steps.dependency-graph.outputs.available != 'true'\n        run: bun run audit:production\n'''
          if old_dependency not in ci:
              raise SystemExit("dependency review block changed")
          ci_path.write_text(ci.replace(old_dependency, new_dependency, 1))
          PY
      - name: Format changed code
        run: bunx prettier --write src/index.test.ts
      - name: Build WASM
        run: |
          if ! command -v wasm-pack; then cargo install wasm-pack --version 0.14.0 --locked; fi
          bun run build:wasm
      - name: Verify repaired suites
        run: |
          bunx vitest run src/index.test.ts src/components/density-table.test.tsx --reporter=verbose
          bun run test:coverage
          bun run check-types
          bun run lint
          bun run format:check
          bun run docs:check
      - name: Commit verified repairs
        run: |
          rm .github/workflows/fix-baseline-once.yml
          rm .github/workflows/diagnose-baseline-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair chart baseline validation"
          git push origin HEAD:decouple-ui-runtime
