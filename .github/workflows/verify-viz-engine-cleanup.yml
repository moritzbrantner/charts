name: Verify viz-engine cleanup

on:
  push:
    branches:
      - chore/remove-viz-engine-residue

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install from cleaned lockfile
        run: bun install --frozen-lockfile

      - name: Verify dependency boundary
        run: bunx vitest run src/entrypoints.test.ts

      - name: Check types
        run: bun run check-types

      - name: Build package
        run: bun run build

      - name: Test Rust kernel
        run: bun run test:wasm
