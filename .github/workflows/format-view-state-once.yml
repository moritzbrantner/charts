name: Format view state once

on:
  push:
    branches:
      - chore/remove-viz-engine-residue

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6.0.2
        with:
          ref: chore/remove-viz-engine-residue

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format view state
        run: bunx prettier --write src/view-state.ts

      - name: Remove one-off workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-view-state-once.yml
          git add src/view-state.ts
          git commit -m "Format chart view state"
          git push origin HEAD:chore/remove-viz-engine-residue
