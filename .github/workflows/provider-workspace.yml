name: Provider validation workspace
on:
  push:
    branches: [bench/startup-interactions-20260923]
    paths: [.github/workflows/provider-workspace.yml]
permissions:
  contents: read
  actions: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Consume existing production build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api repos/${{ github.repository }}/actions/runs/35888326089/artifacts --jq '.artifacts[] | select(.name | startswith("build-artifact-")) | .id')
          gh api repos/${{ github.repository }}/actions/artifacts/$id/zip > /tmp/build.zip
          mkdir -p dist
          unzip -q /tmp/build.zip -d dist
      - name: Retain reproducible local validation inputs
        run: |
          mkdir -p /tmp/provider-workspace
          git archive HEAD | gzip > /tmp/provider-workspace/source.tar.gz
          tar -czf /tmp/provider-workspace/dependencies.tar.gz node_modules dist
          cp "$(command -v node)" /tmp/provider-workspace/node
          du -h /tmp/provider-workspace/*
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: provider-validation-workspace
          path: /tmp/provider-workspace/
          retention-days: 2
          compression-level: 0
