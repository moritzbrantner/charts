name: Fix decoupling semantics once

on:
  push:
    branches:
      - decouple-ui-runtime

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: decouple-ui-runtime
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Restore control semantics
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/internal/ui-primitives.tsx")
          text = path.read_text()

          old_group = '''export function ToggleGroup({ children, className, disabled = false, onValueChange, size: _size, type: _type, value, ...props }: ToggleGroupProps) {
  return (
    <ToggleGroupContext.Provider value={{ disabled, onValueChange, value }}>
      <div className={cn("inline-flex items-center rounded-md border border-border bg-background p-0.5", className)} {...props}>
        {children}
      </div>
    </ToggleGroupContext.Provider>
  );
}'''
          new_group = '''export function ToggleGroup({
  children,
  className,
  disabled = false,
  onValueChange,
  role = "group",
  size: _size,
  type: _type,
  value,
  ...props
}: ToggleGroupProps) {
  return (
    <ToggleGroupContext.Provider value={{ disabled, onValueChange, value }}>
      <div
        className={cn("inline-flex items-center rounded-md border border-border bg-background p-0.5", className)}
        role={role}
        {...props}
      >
        {children}
      </div>
    </ToggleGroupContext.Provider>
  );
}'''
          if old_group not in text:
              raise SystemExit("ToggleGroup shape changed")
          text = text.replace(old_group, new_group)

          old_item = '''export function ToggleGroupItem({ children, className, disabled, onClick, value, ...props }: ToggleGroupItemProps) {
  const group = useContext(ToggleGroupContext);
  const pressed = group.value === value;

  return (
    <button
      aria-pressed={pressed}
      className={cn(
        "inline-flex h-7 items-center justify-center rounded px-2 text-xs font-medium text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50",
        pressed && "bg-accent text-accent-foreground",
        className,
      )}
      disabled={disabled ?? group.disabled}
      onClick={(event) => {
        onClick?.(event);
        if (!event.defaultPrevented) {
          group.onValueChange?.(pressed ? "" : value);
        }
      }}
      type="button"
      {...props}
    >
      {children}
    </button>
  );
}'''
          new_item = '''export function ToggleGroupItem({
  children,
  className,
  disabled,
  onClick,
  role = "radio",
  value,
  ...props
}: ToggleGroupItemProps) {
  const group = useContext(ToggleGroupContext);
  const pressed = group.value === value;
  const isDisabled = disabled ?? group.disabled;

  return (
    <button
      aria-checked={pressed}
      className={cn(
        "inline-flex h-7 items-center justify-center rounded px-2 text-xs font-medium text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50",
        pressed && "bg-accent text-accent-foreground",
        className,
      )}
      disabled={isDisabled}
      onClick={(event) => {
        onClick?.(event);
        if (!event.defaultPrevented && !isDisabled) {
          group.onValueChange?.(pressed ? "" : value);
        }
      }}
      role={role}
      type="button"
      {...props}
    >
      {children}
    </button>
  );
}'''
          if old_item not in text:
              raise SystemExit("ToggleGroupItem shape changed")
          text = text.replace(old_item, new_item)

          old_checkbox = '''export function Checkbox({ checked = false, className, onCheckedChange, ...props }: CheckboxProps) {
  return (
    <input
      aria-checked={checked === "indeterminate" ? "mixed" : checked}
      checked={checked === true}
      className={cn("size-4 rounded border border-input accent-primary", className)}
      onChange={(event) => onCheckedChange?.(event.currentTarget.checked)}
      type="checkbox"
      {...props}
    />
  );
}'''
          new_checkbox = '''export function Checkbox({
  checked = false,
  className,
  disabled = false,
  onCheckedChange,
  ...props
}: CheckboxProps) {
  return (
    <input
      {...props}
      aria-checked={checked === "indeterminate" ? "mixed" : checked}
      checked={checked === true}
      className={cn("size-4 rounded border border-input accent-primary", className)}
      disabled={disabled}
      onChange={(event) => {
        if (!disabled) {
          onCheckedChange?.(event.currentTarget.checked);
        }
      }}
      type="checkbox"
    />
  );
}'''
          if old_checkbox not in text:
              raise SystemExit("Checkbox shape changed")
          text = text.replace(old_checkbox, new_checkbox)

          path.write_text(text)
          PY
      - name: Format
        run: bunx prettier --write src/internal/ui-primitives.tsx
      - name: Verify affected behavior
        run: |
          bunx vitest run src/components.test.tsx src/quality.test.tsx
          bunx eslint src/internal/ui-primitives.tsx
          bunx prettier --check src/internal/ui-primitives.tsx
          bun run check-types
      - name: Commit fix
        run: |
          rm .github/workflows/fix-decouple-semantics-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve chart control semantics"
          git push origin HEAD:decouple-ui-runtime
