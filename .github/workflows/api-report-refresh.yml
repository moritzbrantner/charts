name: Refresh API Report Once

on:
  push:
    branches:
      - feat/contour-bin-transforms
    paths:
      - .github/workflows/api-report-refresh.yml

permissions:
  contents: write

env:
  BUN_VERSION: 1.3.14

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install wasm-pack
        run: if ! command -v wasm-pack; then cargo install wasm-pack --version 0.14.0 --locked; fi

      - name: Generate declarations and API report
        run: |
          bun run build:wasm
          bun run build
          node scripts/check-api-report.mjs || true
          test -f temp/charts.api.md
          cp temp/charts.api.md etc/charts.api.md

      - name: Commit generated report and remove helper workflow
        run: |
          git rm .github/workflows/api-report-refresh.yml
          git add etc/charts.api.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update public API report"
          git push origin HEAD:${GITHUB_REF_NAME}
