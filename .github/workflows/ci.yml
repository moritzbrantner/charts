name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - main
      - release/**
    tags:
      - v*
  schedule:
    - cron: "21 3 * * 1"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validation-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      provider: ${{ steps.scope.outputs.provider }}
      allow-skipped: ${{ steps.scope.outputs.allow-skipped }}
    steps:
      - id: scope
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import subprocess
          with open(os.environ["GITHUB_EVENT_PATH"]) as source:
              event = json.load(source)
          provider = True
          skipped = []
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              current = json.loads(subprocess.check_output([
                  "gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/pulls/{event['number']}"
              ]))
              if current["head"]["sha"] != event["pull_request"]["head"]["sha"]:
                  raise RuntimeError("PR head changed; this validation scope is stale")
              provider = any(label["name"].casefold() == "benchmark-providers" for label in current["labels"])
              if not provider:
                  skipped.append("provider-benchmark")
              if event["repository"]["visibility"] != "public":
                  skipped.append("dependency-review")
          else:
              skipped.append("dependency-review")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"provider={str(provider).lower()}", file=output)
              print(f"allow-skipped={json.dumps(skipped)}", file=output)

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check dependency graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(
            curl -sS -o /dev/null -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom"
          )"

          case "$status" in
            200)
              echo "available=true" >> "$GITHUB_OUTPUT"
              ;;
            403|404)
              echo "available=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected dependency graph status: $status" >&2
              exit 1
              ;;
          esac

      - name: Dependency review
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Check fallback dependency changes
        if: steps.dependency-graph.outputs.available == 'false'
        id: dependency-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" -- package.json bun.lock crates)"
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -Eq '^(package\.json|bun\.lock)$'; then
            echo "bun=true" >> "$GITHUB_OUTPUT"
          else
            echo "bun=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$changed" | grep -Eq '^crates/.+/(Cargo\.toml|Cargo\.lock)$'; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun fallback
        if: steps.dependency-changes.outputs.bun == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies for fallback audit
        if: steps.dependency-changes.outputs.bun == 'true'
        run: bun install --frozen-lockfile

      - name: Audit changed Bun dependencies
        if: steps.dependency-changes.outputs.bun == 'true'
        run: bun run audit:production

      - name: Reject unreviewed Cargo dependency changes
        if: steps.dependency-changes.outputs.cargo == 'true'
        run: |
          echo "Dependency Graph is unavailable and Cargo dependency files changed; dependency review cannot be completed safely." >&2
          exit 1

      - name: No dependency changes to review
        if: >-
          steps.dependency-graph.outputs.available == 'false' &&
          steps.dependency-changes.outputs.bun == 'false' &&
          steps.dependency-changes.outputs.cargo == 'false'
        run: echo "No dependency manifest or lockfile changes in this pull request."

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            crates/charts-density-wasm/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/charts-density-wasm/Cargo.lock') }}

      - name: Install wasm-pack
        uses: moritzbrantner/reusable-workflows/.github/actions/install-verified-wasm-cli@e60855ad67f3dad72c283c355d544d6d296241d7
        with:
          tool: wasm-pack
          version: "0.14.0"

      - name: Cache Bun install cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build WASM
        run: bun run build:wasm

      - name: Check types
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Check docs
        run: bun run docs:check

      - name: Test with coverage
        run: bun run test:coverage

      - name: Check deterministic performance contracts
        run: |
          bun run performance:contract
          bun run bench:providers:test

      - name: Upload deterministic performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-contract
          path: |
            test-results/charts-performance-contract.json
            test-results/charts-performance-contract.md
          if-no-files-found: ignore

      - name: Check public API report
        run: bun run api:check

      - name: Production dependency audit
        run: bun run audit:production

  build-package:
    name: Build or reuse package
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@544af51c921b09b4452b7346347ec9effa58f179
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      artifact_key: charts-package-v1
      node_version: lts/*
      bun_version: latest
      rust_toolchain: stable
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      setup_command: bun install --frozen-lockfile && if ! command -v wasm-pack; then cargo install wasm-pack --version 0.14.0 --locked; fi
      build_command: bun run build:wasm && bun run build
      artifact_paths: dist
      reuse_across_runs: true
      artifact_retention_days: 7

  package:
    runs-on: ubuntu-latest
    needs:
      - quality
      - build-package
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.build-package.outputs.source_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache Bun install cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Consume verified package
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@544af51c921b09b4452b7346347ec9effa58f179
        with:
          producer_run_id: ${{ needs.build-package.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-package.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
          source_sha: ${{ needs.build-package.outputs.source_sha }}
          artifact_key: ${{ needs.build-package.outputs.artifact_key }}
          identity_digest: ${{ needs.build-package.outputs.identity_digest }}
          destination_path: dist
          github_token: ${{ github.token }}

      - name: Build examples
        run: bun run build:examples

      - name: Build Storybook
        run: bun run build:storybook

      - name: Check package artifact
        run: bunx --bun publint --pack bun --strict && node ./scripts/check-packed-artifact.mjs

  browser:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            crates/charts-density-wasm/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/charts-density-wasm/Cargo.lock') }}

      - name: Install wasm-pack
        uses: moritzbrantner/reusable-workflows/.github/actions/install-verified-wasm-cli@e60855ad67f3dad72c283c355d544d6d296241d7
        with:
          tool: wasm-pack
          version: "0.14.0"

      - name: Cache Bun install cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build WASM
        run: bun run build:wasm

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: bun run test:e2e

      - name: Visual chart snapshots
        run: bun run test:visual

      - name: Storybook interaction and a11y tests
        run: bun run test:storybook

      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-artifacts
          path: |
            playwright-report/
            test-results/
            storybook-static/
          if-no-files-found: ignore

  page-quality:
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache Bun install cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run Unlighthouse
        run: bun run test:unlighthouse

      - name: Upload page-quality artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: page-quality-artifacts
          path: .unlighthouse/
          if-no-files-found: ignore

  benchmark:
    runs-on: ubuntu-latest
    needs:
      - package
      - build-package
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.build-package.outputs.source_sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache Bun install cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Consume verified package
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@544af51c921b09b4452b7346347ec9effa58f179
        with:
          producer_run_id: ${{ needs.build-package.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-package.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
          source_sha: ${{ needs.build-package.outputs.source_sha }}
          artifact_key: ${{ needs.build-package.outputs.artifact_key }}
          identity_digest: ${{ needs.build-package.outputs.identity_digest }}
          destination_path: dist
          github_token: ${{ github.token }}

      - name: Benchmark
        env:
          CHARTS_BENCH_FULL: ${{ (github.event_name == 'schedule' || startsWith(github.ref_name, 'release/') || startsWith(github.ref, 'refs/tags/v')) && '1' || '0' }}
          CHARTS_BENCH_JSON: benchmark-results.json
        run: |
          set -o pipefail
          bun run bench:large-data:built | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: |
            benchmark-results.txt
            benchmark-results.json

  provider-benchmark:
    name: Chart provider comparisons
    if: github.event_name != 'pull_request' || needs.validation-scope.outputs.provider == 'true'
    needs: [validation-scope, build-package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.build-package.outputs.source_sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache Bun install cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Consume verified package
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@544af51c921b09b4452b7346347ec9effa58f179
        with:
          producer_run_id: ${{ needs.build-package.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-package.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
          source_sha: ${{ needs.build-package.outputs.source_sha }}
          artifact_key: ${{ needs.build-package.outputs.artifact_key }}
          identity_digest: ${{ needs.build-package.outputs.identity_digest }}
          destination_path: dist
          github_token: ${{ github.token }}

      - name: Install benchmark browser
        run: bunx playwright install --with-deps chromium

      - name: Compare providers
        env:
          BENCH_PROFILE: ${{ github.event_name == 'pull_request' && 'smoke' || github.event_name == 'schedule' && 'full' || 'default' }}
        run: |
          case "$BENCH_PROFILE" in
            smoke) bun run bench:providers:smoke ;;
            full) bun run bench:providers:full ;;
            default) bun run bench:providers ;;
          esac

      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-provider-benchmarks
          path: test-results/provider-bench/
          if-no-files-found: ignore

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-provider-diagnostics
          path: |
            test-results/provider-site/
            test-results/provider-vendors/
          if-no-files-found: ignore

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs:
      [
        "validation-scope",
        "dependency-review",
        "quality",
        "build-package",
        "package",
        "browser",
        "page-quality",
        "benchmark",
        "provider-benchmark",
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["validation-scope", "dependency-review", "quality", "build-package", "package", "browser", "page-quality", "benchmark", "provider-benchmark"]'
          allow-skipped: ${{ needs.validation-scope.outputs.allow-skipped || '[]' }}
