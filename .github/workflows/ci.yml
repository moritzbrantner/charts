name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
    tags:
      - v*
  schedule:
    - cron: "21 3 * * 1"

env:
  BUN_VERSION: 1.3.14

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Check dependency graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(
            curl -sS -o /dev/null -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom"
          )"

          case "$status" in
            200)
              echo "available=true" >> "$GITHUB_OUTPUT"
              ;;
            403|404)
              echo "available=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected dependency graph status: $status" >&2
              exit 1
              ;;
          esac

      - name: Dependency review
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@v5.0.0

      - name: Check fallback dependency changes
        if: steps.dependency-graph.outputs.available == 'false'
        id: dependency-changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- package.json bun.lock crates)"
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -Eq '^(package\.json|bun\.lock)$'; then
            echo "bun=true" >> "$GITHUB_OUTPUT"
          else
            echo "bun=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$changed" | grep -Eq '^crates/.+/(Cargo\.toml|Cargo\.lock)$'; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun fallback
        if: steps.dependency-changes.outputs.bun == 'true'
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies for fallback audit
        if: steps.dependency-changes.outputs.bun == 'true'
        run: bun install --frozen-lockfile

      - name: Audit changed Bun dependencies
        if: steps.dependency-changes.outputs.bun == 'true'
        run: bun audit --production

      - name: Reject unreviewed Cargo dependency changes
        if: steps.dependency-changes.outputs.cargo == 'true'
        run: |
          echo "Dependency Graph is unavailable and Cargo dependency files changed; dependency review cannot be completed safely." >&2
          exit 1

      - name: No dependency changes to review
        if: >-
          steps.dependency-graph.outputs.available == 'false' &&
          steps.dependency-changes.outputs.bun == 'false' &&
          steps.dependency-changes.outputs.cargo == 'false'
        run: echo "No dependency manifest or lockfile changes in this pull request."

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            crates/charts-density-wasm/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/charts-density-wasm/Cargo.lock') }}

      - name: Install wasm-pack
        run: if ! command -v wasm-pack; then cargo install wasm-pack --version 0.14.0 --locked; fi

      - name: Cache Bun install cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build WASM
        run: bun run build:wasm

      - name: Check types
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Check docs
        run: bun run docs:check

      - name: Test with coverage
        run: bun run test:coverage

      - name: Check public API report
        run: bun run api:check

      - name: Production dependency audit
        run: bun run audit:production

  package:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            crates/charts-density-wasm/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/charts-density-wasm/Cargo.lock') }}

      - name: Install wasm-pack
        run: if ! command -v wasm-pack; then cargo install wasm-pack --version 0.14.0 --locked; fi

      - name: Cache Bun install cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Build examples
        run: bun run build:examples

      - name: Build Storybook
        run: bun run build:storybook

      - name: Check package artifact
        run: bun run pack:check

  browser:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            crates/charts-density-wasm/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/charts-density-wasm/Cargo.lock') }}

      - name: Install wasm-pack
        run: if ! command -v wasm-pack; then cargo install wasm-pack --version 0.14.0 --locked; fi

      - name: Cache Bun install cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build WASM
        run: bun run build:wasm

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: bun run test:e2e

      - name: Visual chart snapshots
        run: bun run test:visual

      - name: Storybook interaction and a11y tests
        run: bun run test:storybook

      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-artifacts
          path: |
            playwright-report/
            test-results/
            storybook-static/
          if-no-files-found: ignore

  page-quality:
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run Unlighthouse
        run: bun run test:unlighthouse

      - name: Upload page-quality artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: page-quality-artifacts
          path: .unlighthouse/
          if-no-files-found: ignore

  benchmark:
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            crates/charts-density-wasm/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/charts-density-wasm/Cargo.lock') }}

      - name: Install wasm-pack
        run: if ! command -v wasm-pack; then cargo install wasm-pack --version 0.14.0 --locked; fi

      - name: Cache Bun install cache
        uses: actions/cache@v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Benchmark
        env:
          CHARTS_BENCH_ENFORCE_WASM_RATIO: "1"
          CHARTS_BENCH_FULL: ${{ (github.event_name == 'schedule' || startsWith(github.ref_name, 'release/') || startsWith(github.ref, 'refs/tags/v')) && '1' || '0' }}
        run: bun run bench:large-data | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7.0.1
        with:
          name: benchmark-results
          path: benchmark-results.txt
