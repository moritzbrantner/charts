name: Deterministic Findings

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  findings:
    name: Deterministic Findings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Inspect deterministic findings
        uses: moritzbrantner/coding-tooling@8a56d5a1961a980719c354f7877d05a514e33ec2
        with:
          operation: findings
          bun-version: latest
          install-mode: none
          report-path: .artifacts/coding-tooling/findings.json

      - name: Upload findings evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deterministic-findings-${{ github.sha }}
          path: .artifacts/coding-tooling/findings.json
          if-no-files-found: error
          retention-days: 7
