name: Regenerate baseline lock once

on:
  push:
    branches:
      - fix/ci-baseline

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout baseline branch
        uses: actions/checkout@v6.0.2
        with:
          ref: fix/ci-baseline

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Refresh compatible UI dependency graph
        run: bun update @moritzbrantner/ui

      - name: Verify types
        run: bun run check-types

      - name: Verify production dependency audit
        run: bun run audit:production

      - name: Commit refreshed dependency graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "Dependency graph already current."
            exit 0
          fi
          git commit -m "Refresh compatible UI dependency graph"
          git push origin HEAD:fix/ci-baseline
