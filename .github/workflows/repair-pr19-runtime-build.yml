name: Repair PR19 runtime build

on:
  push:
    branches:
      - perf/wasm-demand-driven-preparation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6.0.2
        with:
          ref: perf/wasm-demand-driven-preparation

      - name: Build first-party WASM before package and benchmark builds
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = '''      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
'''
          new = '''      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build WASM
        run: bun run build:wasm

      - name: Build
        run: bun run build
'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected package and benchmark build blocks, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - name: Remove helper and commit
        run: |
          rm .github/workflows/repair-pr19-runtime-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/repair-pr19-runtime-build.yml
          git commit -m "Prepare WASM runtime before package benchmarks"
          git push origin HEAD:perf/wasm-demand-driven-preparation
