name: Fix decoupling formatting once

on:
  push:
    branches:
      - decouple-ui-runtime

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: decouple-ui-runtime
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format migration file
        run: bunx prettier --write src/components/selectors.tsx
      - name: Verify focused hygiene
        run: |
          bunx prettier --check src/components/selectors.tsx
          bunx eslint src/components/selectors.tsx
          bun run check-types
      - name: Commit fix
        run: |
          rm .github/workflows/fix-decouple-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format charts decoupling changes"
          git push origin HEAD:decouple-ui-runtime
