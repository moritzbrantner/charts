name: Decouple UI once

on:
  push:
    branches:
      - decouple-ui-runtime

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: decouple-ui-runtime
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - name: Apply narrow decoupling
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          production_files = [
              "src/components/axis.tsx",
              "src/components/chrome.tsx",
              "src/components/interactive.tsx",
              "src/components/selectors.tsx",
              "src/components/svg-hierarchy.tsx",
              "src/components/types.ts",
              "src/components/value-preview.tsx",
          ]
          for name in production_files:
              path = Path(name)
              text = path.read_text()
              old = 'from "@moritzbrantner/ui"'
              if old not in text:
                  raise SystemExit(f"expected UI import missing from {name}")
              path.write_text(text.replace(old, 'from "../internal/ui-primitives"'))

          components = Path("src/components.ts")
          text = components.read_text()
          export_line = 'export { ChartContainer, type ChartConfig } from "./internal/ui-primitives";\n'
          if export_line not in text:
              components.write_text(export_line + text)

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          ui_range = package.get("dependencies", {}).pop("@moritzbrantner/ui", None)
          if ui_range is None:
              raise SystemExit("expected @moritzbrantner/ui production dependency")
          package.setdefault("devDependencies", {})["@moritzbrantner/ui"] = ui_range
          package["sideEffects"] = ["*.css"]
          package.setdefault("exports", {})["./styles.css"] = "./dist/styles.css"
          build = package["scripts"]["build"]
          styles_build = "vite build --config vite.styles.config.ts"
          if styles_build not in build:
              package["scripts"]["build"] = f"{build} && {styles_build}"
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          readme = Path("README.md")
          text = readme.read_text()
          text = text.replace(
              'import { ChartContainer } from "@moritzbrantner/ui";',
              'import { ChartContainer } from "@moritzbrantner/charts";',
          )
          install_marker = "The package is published to public npm.\n"
          standalone_note = (
              "The package is published to public npm.\n\n"
              "For the packaged React controls, import the standalone stylesheet once:\n\n"
              "```ts\nimport \"@moritzbrantner/charts/styles.css\";\n```\n\n"
              "`@moritzbrantner/ui` is not required by consumers. Chart colors and surface tokens can be\n"
              "overridden through the `--charts-*` CSS custom properties.\n"
          )
          if "@moritzbrantner/charts/styles.css" not in text:
              if install_marker not in text:
                  raise SystemExit("README installation marker changed")
              text = text.replace(install_marker, standalone_note)
          readme.write_text(text)

          check = Path("scripts/check-packed-artifact.mjs")
          text = check.read_text()
          worker_assert = '  assertFile(path.join(packageDir, "dist", "worker.js"));\n'
          style_assert = '  assertFile(path.join(packageDir, "dist", "styles.css"));\n'
          if style_assert not in text:
              text = text.replace(worker_assert, worker_assert + style_assert)
          peer_marker = '  assertPeerDependency(packageJson, "recharts", "^3.0.0");\n'
          independence = '''\n  if (\n    packageJson.dependencies?.["@moritzbrantner/ui"] ||\n    packageJson.peerDependencies?.["@moritzbrantner/ui"]\n  ) {\n    throw new Error("Packed charts package must not require @moritzbrantner/ui.");\n  }\n'''
          if "Packed charts package must not require" not in text:
              text = text.replace(peer_marker, peer_marker + independence)
          check.write_text(text)
          PY
      - name: Refresh lockfile
        run: bun install
      - name: Format touched files
        run: >-
          bunx prettier --write
          package.json README.md scripts/check-packed-artifact.mjs
          src/components.ts src/components/axis.tsx src/components/chrome.tsx
          src/components/interactive.tsx src/components/selectors.tsx
          src/components/svg-hierarchy.tsx src/components/types.ts
          src/components/value-preview.tsx src/internal/ui-primitives.tsx
          src/styles.css src/styles-entry.ts vite.styles.config.ts
      - name: Check types
        run: bun run check-types
      - name: Build
        run: bun run build
      - name: Check packed consumer
        run: bun run pack:check
      - name: Commit migration
        run: |
          rm .github/workflows/decouple-ui-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Decouple charts runtime from ui"
          git push origin HEAD:decouple-ui-runtime
