name: Validate provider benchmark implementation
on:
  push:
    branches:
      - bench/provider-comparisons-20260923
permissions:
  contents: read
jobs:
  build-package:
    permissions:
      actions: read
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/build-artifact.yml@544af51c921b09b4452b7346347ec9effa58f179
    with:
      source_sha: ${{ github.sha }}
      artifact_key: charts-package-v1
      node_version: "24"
      bun_version: "1.3.14"
      rust_toolchain: stable
      cache_bun: true
      bun_cache_dependency_path: bun.lock
      setup_command: bun install --frozen-lockfile && if ! command -v wasm-pack; then cargo install wasm-pack --version 0.14.0 --locked; fi
      build_command: bun run build:wasm && bun run build
      artifact_paths: dist
      reuse_across_runs: true
      artifact_retention_days: 7
  validate:
    needs: build-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Wire scripts and shared CI artifact consumption
        id: unpack
        run: node .provider-bootstrap.mjs
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format implementation
        run: bunx prettier --write benchmarks/providers package.json .github/workflows/ci.yml
      - name: Consume verified package
        uses: moritzbrantner/reusable-workflows/.github/actions/consume-build-artifact@544af51c921b09b4452b7346347ec9effa58f179
        with:
          producer_run_id: ${{ needs.build-package.outputs.producer_run_id }}
          receipt_artifact_name: ${{ needs.build-package.outputs.receipt_artifact_name }}
          artifact_name: ${{ needs.build-package.outputs.artifact_name }}
          artifact_digest: ${{ needs.build-package.outputs.artifact_digest }}
          source_sha: ${{ needs.build-package.outputs.source_sha }}
          artifact_key: ${{ needs.build-package.outputs.artifact_key }}
          identity_digest: ${{ needs.build-package.outputs.identity_digest }}
          destination_path: dist
          github_token: ${{ github.token }}
      - name: Lint benchmark harness
        run: bunx eslint benchmarks/providers --max-warnings 0
      - name: Test benchmark contracts
        run: bun run bench:providers:test
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Exercise actual browser adapters
        run: bun run bench:providers:smoke
      - name: Publish formatted source and remove temporary workflow
        if: always() && steps.unpack.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .provider-bootstrap.mjs .provider-job.yml .github/workflows/provider-benchmark-bootstrap.yml
          git add benchmarks/providers package.json .github/workflows/ci.yml
          git commit -m 'build: wire provider benchmarks into scripts and artifact-reusing CI'
          git push origin HEAD:bench/provider-comparisons-20260923
      - name: Retain verification evidence and formatted sources
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: provider-implementation-verification
          path: |
            benchmarks/providers/
            package.json
            .github/workflows/ci.yml
            test-results/provider-bench/
            test-results/provider-site/
            test-results/provider-vendors/
          include-hidden-files: true
          if-no-files-found: ignore
