name: Diagnose chart baseline once

on:
  push:
    branches:
      - decouple-ui-runtime

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build WASM
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.14.0 --locked
          bun run build:wasm
      - name: Run failing suites without coverage
        run: bunx vitest run src/index.test.ts src/components/density-table.test.tsx --reporter=verbose
