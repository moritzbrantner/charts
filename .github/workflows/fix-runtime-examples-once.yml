name: Fix runtime examples once

on:
  push:
    branches:
      - fix/runtime-ui-decoupling

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime decoupling branch
        uses: actions/checkout@v6.0.2
        with:
          ref: fix/runtime-ui-decoupling

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Move example chart helpers to chart ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          def replace_all(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"{path}: expected at least one match: {old!r}")
              file.write_text(text.replace(old, new))

          replace_once(
              "examples/src/playground/chart-playground.tsx",
              'import { Badge, ChartContainer, ContextActionMenu } from "@moritzbrantner/ui";',
              'import { Badge, ContextActionMenu } from "@moritzbrantner/ui";',
          )
          replace_once(
              "examples/src/playground/chart-playground.tsx",
              "  ChartCalendarHeatmapSvg,\n",
              "  ChartCalendarHeatmapSvg,\n  ChartContainer,\n",
          )
          replace_once(
              "examples/src/playground/chart-playground.tsx",
              "              yAxisDataDomain,\n            })}\n          </ChartContainer>",
              "              yAxisDataDomain,\n            })!}\n          </ChartContainer>",
          )

          replace_once(
              "examples/src/playground/dense-trend.tsx",
              'import {\n  ActionMenu,\n  Button,\n  ChartContainer,\n  ChartTooltip,\n  ChartTooltipContent,\n  ContextActionMenu,\n  copyText,\n} from "@moritzbrantner/ui";',
              'import {\n  ActionMenu,\n  Button,\n  ContextActionMenu,\n  copyText,\n} from "@moritzbrantner/ui";',
          )
          replace_once(
              "examples/src/playground/dense-trend.tsx",
              'import { Area, AreaChart, Bar, BarChart, CartesianGrid, XAxis, YAxis } from "recharts";',
              'import { Area, AreaChart, Bar, BarChart, CartesianGrid, Tooltip, XAxis, YAxis } from "recharts";',
          )
          replace_once(
              "examples/src/playground/dense-trend.tsx",
              "  ChartDomainMinimap,\n",
              "  ChartContainer,\n  ChartDomainMinimap,\n",
          )
          replace_all(
              "examples/src/playground/dense-trend.tsx",
              "<ChartTooltip content={<ChartTooltipContent />} />",
              "<Tooltip />",
          )

          replace_once(
              "examples/src/playground/example-sections.tsx",
              'import {\n  Badge,\n  ChartContainer,\n  ChartTooltip,\n  ChartTooltipContent,\n  ToggleGroup,\n  ToggleGroupItem,\n} from "@moritzbrantner/ui";',
              'import {\n  Badge,\n  ToggleGroup,\n  ToggleGroupItem,\n} from "@moritzbrantner/ui";',
          )
          replace_once(
              "examples/src/playground/example-sections.tsx",
              "  LineChart,\n  XAxis,\n",
              "  LineChart,\n  Tooltip,\n  XAxis,\n",
          )
          replace_once(
              "examples/src/playground/example-sections.tsx",
              "  ChartCalendarHeatmapSvg,\n",
              "  ChartCalendarHeatmapSvg,\n  ChartContainer,\n",
          )
          replace_all(
              "examples/src/playground/example-sections.tsx",
              "<ChartTooltip content={<ChartTooltipContent />} />",
              "<Tooltip />",
          )

          replace_once(
              "examples/src/playground/playground-renderer.tsx",
              'import { ChartTooltip, ChartTooltipContent } from "@moritzbrantner/ui";\n',
              "",
          )
          replace_once(
              "examples/src/playground/playground-renderer.tsx",
              "  ReferenceLine,\n  XAxis,\n",
              "  ReferenceLine,\n  Tooltip,\n  XAxis,\n",
          )
          replace_all(
              "examples/src/playground/playground-renderer.tsx",
              "<ChartTooltip content={<ChartTooltipContent />} />",
              "<Tooltip />",
          )

          replace_once(
              "src/components/stories/story-support.tsx",
              'import { ChartContainer, type ChartConfig } from "@moritzbrantner/ui";\n\nimport type { ChartRange } from "@moritzbrantner/charts";',
              'import {\n  ChartContainer,\n  type ChartConfig,\n  type ChartRange,\n} from "@moritzbrantner/charts";',
          )
          replace_once(
              "src/components/stories/story-support.tsx",
              'import type { ReactNode } from "react";',
              'import type { ReactElement, ReactNode } from "react";',
          )
          replace_once(
              "src/components/stories/story-support.tsx",
              "}: {\n  children: ReactNode;\n  className?: string;\n}) {",
              "}: {\n  children: ReactElement;\n  className?: string;\n}) {",
          )
          PY

      - name: Format repaired files
        run: bunx prettier --write examples/src/playground/chart-playground.tsx examples/src/playground/dense-trend.tsx examples/src/playground/example-sections.tsx examples/src/playground/playground-renderer.tsx src/components/stories/story-support.tsx

      - name: Verify types
        run: bun run check-types

      - name: Commit repair and remove helper
        run: |
          rm .github/workflows/fix-runtime-examples-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix chart-owned example imports"
          git push origin HEAD:fix/runtime-ui-decoupling
