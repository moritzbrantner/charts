name: Bug report
description: Report a reproducible problem in @moritzbrantner/charts.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for a maintainer to reproduce it.
  - type: input
    id: version
    attributes:
      label: Package version
      description: Which version of @moritzbrantner/charts are you using?
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Runtime, bundler, browser, React, Recharts, and TypeScript versions.
      placeholder: "Bun 1.3.14, React 19.2, Recharts 3.8, Vite 8"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Link to a minimal reproduction or paste the smallest code sample that demonstrates the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
